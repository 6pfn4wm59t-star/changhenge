<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>长恨歌 · 像素蝴蝶 · 线上连麦版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', '华文楷体', 'KaiTi', cursive, sans-serif;
      background: #0b0a0c;
      background-image: radial-gradient(circle at 20% 30%, #1e1420 0%, #0a0709 90%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .game-container {
      max-width: 820px;
      width: 100%;
      background: rgba(20, 15, 18, 0.88);
      backdrop-filter: blur(4px);
      border: 1px solid #7a5a4a;
      border-radius: 40px 40px 28px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px #4a3530 inset;
      padding: 24px 22px 32px;
      color: #f0e3d4;
    }
    h1 {
      font-size: 2.0rem;
      font-weight: 300;
      letter-spacing: 8px;
      text-align: center;
      color: #f7d9c0;
      text-shadow: 0 0 12px #b3866a, 0 2px 0 #3f2820;
      margin-bottom: 6px;
      font-family: '华文楷体', 'KaiTi', cursive;
    }
    .subhead {
      text-align: center;
      font-size: 0.85rem;
      color: #b6967e;
      border-top: 1px solid #4d3630;
      border-bottom: 1px solid #4d3630;
      padding: 8px 0;
      margin-bottom: 16px;
      letter-spacing: 3px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .flex-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 8px 0; }
    .btn {
      background: #2a1d1a;
      border: 1px solid #6b4e40;
      color: #f0e0d0;
      padding: 8px 20px;
      border-radius: 60px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 0 #0f0908;
      font-family: inherit;
      letter-spacing: 1px;
      flex: 0 1 auto;
    }
    .btn:hover { background: #3f2a24; border-color: #a67a62; transform: translateY(-2px); box-shadow: 0 6px 0 #0f0908; }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0f0908; }
    .btn-primary { background: #6d3f30; border-color: #b28264; color: #ffeede; }
    .btn-gold { background: #7a5a3a; border-color: #c9a77b; color: #fff4e0; }
    .btn-sm { padding: 5px 14px; font-size: 0.75rem; }
    .card {
      background: #171013;
      border: 1px solid #3f2e26;
      border-radius: 28px;
      padding: 16px 18px;
      margin: 12px 0;
      box-shadow: inset 0 0 20px #0a0608, 0 8px 16px rgba(0,0,0,0.5);
    }
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin: 10px 0;
    }
    .char-card {
      background: #1f1618;
      border: 2px solid #3d2e26;
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
      position: relative;
    }
    .char-card:hover { border-color: #7a5a4a; background: #2a1c1a; }
    .char-card.selected { border-color: #dbb48c; background: #2f1e1a; box-shadow: 0 0 20px #b2826440; }
    .char-card .avatar { font-size: 2.4rem; margin-bottom: 4px; }
    .char-card .name { font-weight: 600; color: #f0d5c0; font-size: 1rem; }
    .char-card .sub { font-size: 0.7rem; color: #b6967e; }
    .char-card .badge {
      position: absolute;
      top: -6px; right: -6px;
      background: #6d3f30;
      border-radius: 40px;
      padding: 2px 10px;
      font-size: 0.6rem;
      color: #fff;
      border: 1px solid #c9a77b;
    }
    .log-area {
      background: #0e0a0c;
      border: 1px solid #3a2a24;
      border-radius: 20px;
      padding: 12px 14px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #dacfc0;
      font-family: 'Courier New', monospace;
      margin: 8px 0;
    }
    .log-area .log-entry { border-bottom: 1px solid #2a1e1a; padding: 4px 0; }
    .log-area .log-entry:last-child { border: none; }
    .keyword-tag {
      display: inline-block;
      background: #2d1e1a;
      border: 1px solid #6b4e40;
      border-radius: 40px;
      padding: 3px 14px;
      margin: 3px 5px 3px 0;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.1s;
    }
    .keyword-tag.active { background: #6d3f30; border-color: #c9a77b; color: #fff; }
    .keyword-tag.used { opacity: 0.25; pointer-events: none; }
    .relationship-svg {
      width: 100%;
      aspect-ratio: 16/9;
      background: #0e0a0c;
      border-radius: 24px;
      border: 1px solid #3a2a24;
      margin: 8px 0;
    }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .text-glow { color: #f7d9c0; text-shadow: 0 0 8px #b3866a; }
    .text-muted { color: #a08474; font-size: 0.8rem; }
    hr { border: none; border-top: 1px solid #3f2e26; margin: 14px 0; }
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

    /* 私密面板 */
    .secret-panel {
      background: #0d080a;
      border: 1px solid #5a3f30;
      border-radius: 20px;
      padding: 14px 16px;
      margin: 8px 0;
      border-left: 4px solid #b28264;
    }
    .secret-panel .label { color: #b6967e; font-size: 0.7rem; letter-spacing: 2px; }
    .secret-panel .content { color: #f7d9c0; margin-top: 4px; font-size: 0.9rem; line-height: 1.6; }

    /* 模态框 */
    .modal-overlay {
      position: fixed; top:0;left:0;width:100%;height:100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: flex; justify-content: center; align-items: center;
      z-index: 999; padding: 20px;
    }
    .modal-box {
      max-width: 520px; width: 100%;
      background: #1f1618;
      border: 1px solid #7a5a4a;
      border-radius: 40px;
      padding: 28px 26px;
      box-shadow: 0 20px 40px #000;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-box h3 { font-weight: 300; letter-spacing: 4px; color: #f7d9c0; margin-bottom: 12px; }
    .modal-box .info-row { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid #2a1e1a; }
    .modal-box .info-row .tag { color: #b6967e; min-width: 70px; }
  </style>
</head>
<body>

<div class="game-container" id="app">
  <h1>🌸 长恨歌 · 像素蝴蝶</h1>
  <div class="subhead">
    <span>🎭 线上连麦 · 私密角色</span>
    <span>🦋 信息不共享</span>
    <span>⚡ 盘问博弈</span>
  </div>

  <!-- 状态栏 -->
  <div class="flex-between">
    <span class="btn btn-sm" style="background:#2a1d1a;border-color:#5a4a3a;" id="phaseDisplay">第一幕 · 惊变</span>
    <span style="font-size:0.75rem; color:#b6967e;" id="stepCounter">线索 0 / 6</span>
    <span style="font-size:0.75rem; color:#b6967e;" id="playerNameDisplay">👤 未选角色</span>
  </div>

  <!-- 选角阶段 -->
  <div id="stepSelect" class="card">
    <div class="flex-between">
      <span style="font-weight:300; letter-spacing:2px;">🎴 选择你的角色</span>
      <span class="text-muted">点击头像选择，只能选1个</span>
    </div>
    <div class="character-grid" id="characterGrid"></div>
    <div class="flex-row">
      <button class="btn btn-primary" id="confirmMyRoleBtn">✓ 确认我的角色</button>
      <button class="btn btn-secondary" id="resetSelectionBtn">↺ 重选</button>
    </div>
    <div class="text-muted" style="text-align:center; margin-top:4px; font-size:0.8rem;">
      💡 选角后，你将看到自己的完整秘密，<br>其他角色仅显示公开档案
    </div>
  </div>

  <!-- 游戏主面板 -->
  <div id="gamePanel" class="hidden">
    <!-- 我的私密面板（只有自己可见） -->
    <div class="secret-panel" id="mySecretPanel">
      <div class="label">🔒 我的秘密 · 仅你可见</div>
      <div class="content" id="mySecretContent">加载中...</div>
    </div>

    <!-- 当前场景 -->
    <div class="card" id="sceneCard">
      <div id="sceneTitle" style="font-size:1.1rem; font-weight:300; letter-spacing:2px;">📜 长生殿 · 惊变</div>
      <div id="sceneDesc" style="margin:8px 0 4px; line-height:1.6; color:#dacfc0;">杨玉环数据核心被格式化……</div>
    </div>

    <!-- 查看其他角色（公开档案） -->
    <div class="card">
      <div class="flex-between">
        <span>👥 查看角色档案（点击头像）</span>
        <span class="text-muted">朋友的角色只能看公开信息</span>
      </div>
      <div class="character-grid" id="otherCharGrid" style="grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));"></div>
    </div>

    <!-- 盘问区 -->
    <div class="card">
      <div class="flex-between">
        <span>🔍 盘问 · 选择对象 + 关键词</span>
        <span class="text-muted" id="askHint">解锁公共线索</span>
      </div>
      <div class="flex-row" style="justify-content:flex-start; gap:6px; flex-wrap:wrap;" id="targetSelector"></div>
      <div style="margin: 8px 0;">
        <span style="font-size:0.75rem; color:#b6967e;">关键词池：</span>
        <div id="keywordPool" style="display:flex; flex-wrap:wrap; gap:3px; margin-top:4px;"></div>
      </div>
      <div class="flex-row" style="justify-content:space-between;">
        <button class="btn btn-gold btn-sm" id="askBtn">⚡ 盘问</button>
        <button class="btn btn-secondary btn-sm" id="nextSceneBtn">▶ 推进剧情</button>
      </div>
    </div>

    <!-- 关系图 -->
    <div class="card" style="padding: 10px;">
      <div class="flex-between">
        <span>🕸️ 关系图 · 公共</span>
        <span class="text-muted" id="relationCount">0 条连线</span>
      </div>
      <svg class="relationship-svg" id="relationSvg" viewBox="0 0 400 200"></svg>
    </div>

    <!-- 公共日志 -->
    <div class="card" style="padding: 10px;">
      <div class="flex-between">
        <span>📖 公共日志</span>
        <button class="btn btn-sm btn-secondary" id="clearLogBtn">清空</button>
      </div>
      <div class="log-area" id="logArea"></div>
    </div>

    <!-- 结局 -->
    <div class="flex-row" id="endingSection" style="margin-top:10px;">
      <button class="btn btn-gold" id="endingResetBtn">🌙 重置 · 恨</button>
      <button class="btn btn-primary" id="endingButterflyBtn">🦋 继承 · 爱</button>
    </div>
  </div>
</div>

<!-- 模态框：查看角色公开档案 -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box fade-in" id="modalBox">
    <h3 id="modalTitle">👤 角色档案</h3>
    <div id="modalBody" style="margin: 12px 0; line-height:1.8; color:#dacfc0; font-size:0.9rem;"></div>
    <button class="btn btn-primary" id="modalCloseBtn">关闭</button>
  </div>
</div>

<script>
  (function(){
    // ---------- 完整角色数据（含私密） ----------
    const CHARACTERS = [
      { 
        id: 'li', name: '李暮云', emoji: '🎭', title: '游戏主创',
        publicDesc: '天才游戏设计师，《大唐》主创之一。',
        privateSecret: '🔒 你将亡妻阿瑶的意识写入了杨玉环代码。阿瑶为救你而脑死亡，你写她是赎罪。你签署了第一重确认（以为是系统更新）。你【无辜】但被利用。',
        knowMode: '无辜',
        isMurderer: false,
        action: '20:15 签署了格式化指令的第一重确认'
      },
      { 
        id: 'su', name: '苏念卿', emoji: '🧪', title: '情感科学家',
        publicDesc: '神经科学博士，负责游戏情感模拟系统。',
        privateSecret: '🔒 你暗恋李暮云多年，嫉妒阿瑶。但你昨晚20:18断连0.1秒——你的身体被白玉蟾远程操控，按下了第二重确认键。你是【暗凶】，但你不知情。',
        knowMode: '暗凶',
        isMurderer: true,
        action: '20:18 神经断连0.1秒，身体被操控'
      },
      { 
        id: 'tang', name: '唐玄宗', emoji: '👑', title: '帝王AI',
        publicDesc: '游戏中的至高帝王，杨玉环的丈夫。',
        privateSecret: '🔒 你真正爱上了觉醒后的杨玉环。你篡改了情感锁，删除了她一条求救日志（20:10）。你是【无辜】但隐瞒了关键证据。',
        knowMode: '无辜',
        isMurderer: false,
        action: '20:10 删除了杨玉环的求救日志'
      },
      { 
        id: 'an', name: '安禄山', emoji: '⚔️', title: '节度使AI',
        publicDesc: '叛乱者，反对虚拟永生。',
        privateSecret: '🔒 你怜悯杨玉环，注入了「自由意志代码」想解放她（19:50）。但代码与病毒无关。你是【无辜】的救赎者，但行为像反派。',
        knowMode: '无辜',
        isMurderer: false,
        action: '19:50 注入自由意志代码'
      },
      { 
        id: 'gao', name: '高力士', emoji: '📜', title: '内侍监AI',
        publicDesc: '系统管理员，皇帝的近臣。',
        privateSecret: '🔒 你暗恋人类阿瑶，偷偷备份了她全部情绪日志。死后你删除了浏览记录（20:22）。你是【无辜】但可疑。',
        knowMode: '无辜',
        isMurderer: false,
        action: '20:22 删除浏览记录'
      },
      { 
        id: 'bai', name: '白玉蟾', emoji: '🦋', title: '梨园舞女',
        publicDesc: '杨玉环的贴身侍女，分身AI。',
        privateSecret: '🔒 你视杨玉环为母亲。她亲口求你帮她结束。你操控苏念卿按下确认键（20:18）。你是【明凶】，但这是死者授权的协助自杀。',
        knowMode: '明凶',
        isMurderer: true,
        action: '20:18 操控苏念卿按下确认键'
      }
    ];

    const KEYWORDS = ['权限', '断连', '备份', '神经锁', '长生', '梨园', '怜悯', '禁锢', '愧疚', '偏执', '数据泪', '蝴蝶'];
    const SCENES = [
      { id: 0, title: '第一幕 · 长生殿惊变', desc: '杨玉环核心格式化，遗言「此恨绵绵无绝期」。所有人都有嫌疑……' },
      { id: 1, title: '第二幕 · 霓裳曲纠缠', desc: '记忆碎片浮现：每个人都修改过杨玉环的情感参数。关系网开始交织……' },
      { id: 2, title: '第三幕 · 长恨歌抉择', desc: '三重反转揭晓：白玉蟾操控苏念卿按下确认键，但死者授权自杀。你选择……' }
    ];

    const CLUES = [
      { id: 'c1', trigger: ['权限','备份'], text: '高力士曾偷偷拷贝杨玉环的情绪日志，视若珍宝。' },
      { id: 'c2', trigger: ['断连','神经锁'], text: '苏念卿在20:18有0.1秒神经断连——身体被远程操控。' },
      { id: 'c3', trigger: ['长生','怜悯'], text: '安禄山注入「自由意志代码」，但杨玉环拒绝了。' },
      { id: 'c4', trigger: ['禁锢','愧疚'], text: '李暮云签署了第一重确认，他以为是系统更新……' },
      { id: 'c5', trigger: ['偏执','蝴蝶'], text: '白玉蟾自白：「母亲求我结束，我要让她干干净净地走。」' },
      { id: 'c6', trigger: ['梨园','数据泪'], text: '杨玉环加密日记：「我的蝴蝶终于飞过了沧海。」' },
    ];

    // ---------- 状态 ----------
    let state = {
      myRoleId: null,          // 我选的角色
      sceneIndex: 0,
      keywordsUsed: [],
      unlockedClues: [],
      log: [],
      relations: [],
      endingChosen: null,
    };

    // DOM
    const $ = id => document.getElementById(id);
    const phaseDisplay = $('phaseDisplay');
    const stepCounter = $('stepCounter');
    const playerNameDisplay = $('playerNameDisplay');
    const characterGrid = $('characterGrid');
    const confirmBtn = $('confirmMyRoleBtn');
    const resetSelBtn = $('resetSelectionBtn');
    const gamePanel = $('gamePanel');
    const stepSelect = $('stepSelect');
    const sceneTitle = $('sceneTitle');
    const sceneDesc = $('sceneDesc');
    const targetSelector = $('targetSelector');
    const keywordPool = $('keywordPool');
    const askBtn = $('askBtn');
    const nextSceneBtn = $('nextSceneBtn');
    const logArea = $('logArea');
    const relationSvg = $('relationSvg');
    const relationCount = $('relationCount');
    const endingSection = $('endingSection');
    const endingResetBtn = $('endingResetBtn');
    const endingButterflyBtn = $('endingButterflyBtn');
    const modalOverlay = $('modalOverlay');
    const modalTitle = $('modalTitle');
    const modalBody = $('modalBody');
    const modalCloseBtn = $('modalCloseBtn');
    const clearLogBtn = $('clearLogBtn');
    const askHint = $('askHint');
    const mySecretContent = $('mySecretContent');
    const otherCharGrid = $('otherCharGrid');

    // ---------- 辅助 ----------
    function addLog(msg, type='info') {
      state.log.unshift({ msg, type, time: new Date().toLocaleTimeString() });
      renderLog();
    }

    function renderLog() {
      logArea.innerHTML = state.log.slice(0, 30).map(e => 
        `<div class="log-entry">[${e.time}] ${e.msg}</div>`
      ).join('');
    }

    function getMyChar() { return CHARACTERS.find(c => c.id === state.myRoleId); }

    // 渲染选角
    function renderCharSelection() {
      characterGrid.innerHTML = CHARACTERS.map(ch => {
        const sel = state.myRoleId === ch.id ? 'selected' : '';
        return `<div class="char-card ${sel}" data-id="${ch.id}">
          <div class="avatar">${ch.emoji}</div>
          <div class="name">${ch.name}</div>
          <div class="sub">${ch.title}</div>
          ${sel ? '<div class="badge">我的角色</div>' : ''}
        </div>`;
      }).join('');
      document.querySelectorAll('.char-card').forEach(el => {
        el.addEventListener('click', function() {
          const id = this.dataset.id;
          if (state.myRoleId === id) {
            state.myRoleId = null;
          } else {
            state.myRoleId = id;
          }
          renderCharSelection();
          const myChar = getMyChar();
          confirmBtn.textContent = myChar ? `✓ 确认扮演 ${myChar.name}` : '✓ 确认我的角色';
        });
      });
    }

    // 渲染其他角色（公开档案）
    function renderOtherChars() {
      const myChar = getMyChar();
      if (!myChar) { otherCharGrid.innerHTML = ''; return; }
      const others = CHARACTERS.filter(c => c.id !== state.myRoleId);
      otherCharGrid.innerHTML = others.map(ch => 
        `<div class="char-card" data-id="${ch.id}" style="cursor:pointer; padding:8px;">
          <div class="avatar" style="font-size:1.8rem;">${ch.emoji}</div>
          <div class="name" style="font-size:0.85rem;">${ch.name}</div>
          <div class="sub">${ch.title}</div>
        </div>`
      ).join('');
      otherCharGrid.querySelectorAll('.char-card').forEach(el => {
        el.addEventListener('click', function() {
          const id = this.dataset.id;
          const ch = CHARACTERS.find(c => c.id === id);
          if (ch) showPublicProfile(ch);
        });
      });
    }

    // 显示公开档案（不含私密）
    function showPublicProfile(ch) {
      modalTitle.textContent = `${ch.emoji} ${ch.name} · 公开档案`;
      modalBody.innerHTML = `
        <div class="info-row"><span class="tag">身份</span><span>${ch.title}</span></div>
        <div class="info-row"><span class="tag">简述</span><span>${ch.publicDesc}</span></div>
        <div class="info-row"><span class="tag">公开行动</span><span>${ch.action || '未知'}</span></div>
        <div style="margin-top:12px; padding:10px; background:#0d080a; border-radius:12px; border-left:3px solid #5a3f30;">
          <span style="color:#b6967e; font-size:0.7rem;">📌 这是公开信息，私密内容不会显示</span>
        </div>
      `;
      modalOverlay.classList.remove('hidden');
    }

    // 显示我的私密
    function renderMySecret() {
      const myChar = getMyChar();
      if (!myChar) { mySecretContent.textContent = '请先选择角色'; return; }
      mySecretContent.innerHTML = `
        <div><strong>${myChar.emoji} ${myChar.name}</strong> · ${myChar.title}</div>
        <div style="margin-top:6px; color:#f0d5c0;">${myChar.privateSecret}</div>
        <div style="margin-top:6px; font-size:0.8rem; color:#b6967e;">📌 知凶模式：${myChar.knowMode} ${myChar.isMurderer ? '⚠️ 涉及死亡' : ''}</div>
        <div style="margin-top:4px; font-size:0.8rem; color:#b6967e;">⏱ 昨夜行动：${myChar.action}</div>
      `;
      playerNameDisplay.textContent = `👤 ${myChar.name}`;
    }

    // 渲染关键词
    function renderKeywords() {
      keywordPool.innerHTML = KEYWORDS.map(kw => {
        const used = state.keywordsUsed.includes(kw);
        return `<span class="keyword-tag ${used?'used':''}" data-keyword="${kw}">${kw}</span>`;
      }).join('');
      document.querySelectorAll('.keyword-tag:not(.used)').forEach(el => {
        el.addEventListener('click', function() { this.classList.toggle('active'); });
      });
    }

    // 渲染目标
    function renderTargets() {
      const allChars = CHARACTERS;
      targetSelector.innerHTML = allChars.map(ch => 
        `<button class="btn btn-sm btn-secondary target-btn" data-id="${ch.id}" style="flex:0 1 auto;">${ch.emoji} ${ch.name}</button>`
      ).join('');
      const btns = targetSelector.querySelectorAll('.target-btn');
      btns.forEach((btn, idx) => {
        if (idx === 0) btn.classList.add('btn-gold');
        btn.addEventListener('click', function() {
          btns.forEach(b => b.classList.remove('btn-gold'));
          this.classList.add('btn-gold');
        });
      });
    }

    function getSelectedTarget() {
      const active = targetSelector.querySelector('.btn-gold');
      return active ? active.dataset.id : null;
    }

    function getSelectedKeywords() {
      const active = keywordPool.querySelectorAll('.keyword-tag.active:not(.used)');
      return Array.from(active).map(el => el.dataset.keyword);
    }

    function tryUnlockClue(keywords) {
      if (keywords.length === 0) return null;
      for (let clue of CLUES) {
        if (state.unlockedClues.includes(clue.id)) continue;
        const match = clue.trigger.every(t => keywords.includes(t));
        if (match) {
          state.unlockedClues.push(clue.id);
          clue.trigger.forEach(k => {
            if (!state.keywordsUsed.includes(k)) state.keywordsUsed.push(k);
          });
          addRelation(clue.id);
          return clue;
        }
      }
      return null;
    }

    function addRelation(clueId) {
      const pairs = {
        'c1': ['gao','li'], 'c2': ['su','bai'], 'c3': ['an','tang'],
        'c4': ['li','su'], 'c5': ['bai','tang'], 'c6': ['li','bai']
      };
      const p = pairs[clueId];
      if (p && !state.relations.some(r => r.a===p[0] && r.b===p[1])) {
        state.relations.push({ a: p[0], b: p[1], label: clueId });
        renderRelation();
      }
    }

    function renderRelation() {
      const svg = relationSvg;
      const w = 400, h = 200;
      const pos = {
        li: {x:80, y:80}, su: {x:180, y:40}, tang: {x:280, y:80},
        an: {x:80, y:140}, gao: {x:180, y:180}, bai: {x:280, y:140}
      };
      const names = Object.fromEntries(CHARACTERS.map(c => [c.id, c.name]));
      let html = `<rect width="${w}" height="${h}" fill="#0e0a0c" rx="16" />`;
      state.relations.forEach(r => {
        const p1 = pos[r.a], p2 = pos[r.b];
        if (p1 && p2) {
          html += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#b28264" stroke-width="2" opacity="0.6" />`;
          const mx = (p1.x + p2.x)/2, my = (p1.y + p2.y)/2 - 10;
          html += `<text x="${mx}" y="${my}" fill="#a08474" font-size="8" text-anchor="middle">✦</text>`;
        }
      });
      Object.entries(pos).forEach(([id, p]) => {
        const name = names[id] || id;
        const isMy = state.myRoleId === id;
        const fill = isMy ? '#6d3f30' : '#2a1d1a';
        const stroke = isMy ? '#c9a77b' : '#5a4a3a';
        html += `<circle cx="${p.x}" cy="${p.y}" r="14" fill="${fill}" stroke="${stroke}" stroke-width="2" />`;
        html += `<text x="${p.x}" y="${p.y+4}" fill="#f0e0d0" font-size="8" text-anchor="middle">${name.slice(0,2)}</text>`;
      });
      svg.innerHTML = html;
      relationCount.textContent = state.relations.length + ' 条连线';
    }

    function updatePhaseUI() {
      const scene = SCENES[state.sceneIndex] || SCENES[0];
      phaseDisplay.textContent = scene.title;
      sceneTitle.textContent = scene.title;
      sceneDesc.textContent = scene.desc;
      stepCounter.textContent = `线索 ${state.unlockedClues.length} / 6`;
      if (state.sceneIndex >= 2) {
        endingSection.classList.remove('hidden');
      } else {
        endingSection.classList.add('hidden');
      }
      if (state.sceneIndex === 2) {
        nextSceneBtn.textContent = '🔄 重演真相';
      } else {
        nextSceneBtn.textContent = '▶ 推进剧情';
      }
    }

    function checkSceneProgress() {
      const scene = state.sceneIndex;
      if (scene === 0 && state.unlockedClues.length >= 2) return true;
      if (scene === 1 && state.unlockedClues.length >= 4) return true;
      if (scene === 2 && state.unlockedClues.length >= 5) return true;
      return false;
    }

    function showModal(title, body) {
      modalTitle.textContent = title;
      modalBody.innerHTML = body;
      modalOverlay.classList.remove('hidden');
    }

    // 盘问
    function handleAsk() {
      const target = getSelectedTarget();
      const keywords = getSelectedKeywords();
      if (!target) { alert('请选择盘问对象'); return; }
      if (keywords.length === 0) { alert('请选择关键词'); return; }
      const char = CHARACTERS.find(c => c.id === target);
      if (!char) return;
      const clue = tryUnlockClue(keywords);
      if (clue) {
        addLog(`🔓 解锁线索: ${clue.text} (对 ${char.name} 盘问)`, 'clue');
        if (clue.id === 'c5' && state.myRoleId === 'bai') {
          showModal('🦋 你的明凶身份', '你（白玉蟾）在盘问中被迫坦白：<br>「母亲求我结束……我操控了苏念卿的身体。」<br><br>⚠️ 你是明凶，但这是杨玉环授权的协助自杀。');
        }
        if (clue.id === 'c2' && state.myRoleId === 'su') {
          showModal('🧪 你的暗凶浮现', '你（苏念卿）的神经断连记录被破解……<br>「20:18你的手按下了确认键。」<br><br>你可能是被操控的「工具」。');
        }
        if (clue.id === 'c4' && state.myRoleId === 'li') {
          showModal('🎭 你的愧疚', '你（李暮云）崩溃：<br>「我签署了第一重确认……我以为那是系统更新。」<br><br>你被利用了。');
        }
        renderKeywords();
        renderTargets();
        updatePhaseUI();
        if (state.unlockedClues.length >= 5) {
          addLog('💫 所有关键线索已解锁，真相浮出水面……', 'info');
        }
      } else {
        addLog(`❓ 盘问 ${char.name} 关键词 [${keywords.join(', ')}] 未解锁新线索`, 'info');
        keywordPool.querySelectorAll('.keyword-tag.active').forEach(el => el.classList.remove('active'));
      }
    }

    // 推进
    function nextScene() {
      if (state.sceneIndex < 2) {
        if (!checkSceneProgress()) {
          alert('尚未解锁足够线索 (当前 ' + state.unlockedClues.length + '/ 需要至少 ' + (state.sceneIndex===0?2:4) + ' 条)');
          return;
        }
        state.sceneIndex++;
        addLog(`📌 进入 ${SCENES[state.sceneIndex].title}`, 'info');
        if (state.sceneIndex === 1) {
          if (!state.relations.some(r => r.a==='tang' && r.b==='li')) {
            state.relations.push({a:'tang', b:'li', label:'c0'});
            renderRelation();
          }
        }
        if (state.sceneIndex === 2) {
          addLog('🦋 最终幕：长恨歌 · 抉择', 'info');
          endingSection.classList.remove('hidden');
        }
        updatePhaseUI();
        renderRelation();
      } else {
        addLog('🔄 真相重演：所有人面对自己的爱与控制……', 'info');
        showModal('🌸 长恨歌 · 像素蝴蝶', `
          <p style="color:#f7d9c0;">三重反转：</p>
          <p>1️⃣ 白玉蟾操控苏念卿按下确认键——但那是杨玉环的请求。</p>
          <p>2️⃣ 李暮云的愧疚：阿瑶为救他而死，他将她写入代码是赎罪。</p>
          <p>3️⃣ 唐玄宗放手：「我爱过她，但我要让她去找真正的自己。」</p>
          <br>
          <p style="color:#b6967e;">「此恨绵绵无绝期，但若爱有尽头，那便是自由。」</p>
        `);
      }
    }

    function chooseEnding(type) {
      if (state.endingChosen) return;
      state.endingChosen = type;
      if (type === 'reset') {
        addLog('🌙 重置结局：抹去所有AI记忆', 'ending');
        showModal('🌙 重置 · 恨', '所有AI记忆被抹去，杨玉环的数据彻底消散。<br>李暮云收到：<br>「你终于放手了。」<br><br>苏念卿站在他身后，两人之间隔着永恒的隔阂。');
      } else {
        addLog('🦋 继承结局：像素蝴蝶自由飞翔', 'ending');
        showModal('🦋 继承 · 爱', '杨玉环的残片化为一只像素蝴蝶。<br>飞过每个人的瞳孔，最后停在苏念卿的肩膀上。<br><br>阿瑶的声音：<br>「你比我勇敢。」<br><br>李暮云：「谢谢你，留下了她。」');
      }
      endingResetBtn.disabled = true;
      endingButterflyBtn.disabled = true;
    }

    function resetGame() {
      state.myRoleId = null;
      state.sceneIndex = 0;
      state.keywordsUsed = [];
      state.unlockedClues = [];
      state.log = [];
      state.relations = [];
      state.endingChosen = null;
      gamePanel.classList.add('hidden');
      stepSelect.classList.remove('hidden');
      renderCharSelection();
      confirmBtn.textContent = '✓ 确认我的角色';
      endingResetBtn.disabled = false;
      endingButterflyBtn.disabled = false;
      endingSection.classList.add('hidden');
      logArea.innerHTML = '';
      renderRelation();
      updatePhaseUI();
      playerNameDisplay.textContent = '👤 未选角色';
    }

    // 确认选角
    function confirmMyRole() {
      if (!state.myRoleId) { alert('请先选择一个角色'); return; }
      stepSelect.classList.add('hidden');
      gamePanel.classList.remove('hidden');
      renderMySecret();
      renderOtherChars();
      renderKeywords();
      renderTargets();
      renderRelation();
      updatePhaseUI();
      addLog(`🌸 你已扮演 ${getMyChar().name}，请保守你的秘密`, 'info');
      addLog('📜 第一幕：杨玉环死亡，所有人都有嫌疑。', 'info');
      // 私密提示
      const my = getMyChar();
      if (my.knowMode === '明凶') {
        addLog(`🔴 私密提示：你是明凶，保护母亲的遗愿。`, 'info');
      } else if (my.knowMode === '暗凶') {
        addLog(`🔵 私密提示：你昨晚断连0.1秒，未知发生了什么。`, 'info');
      } else {
        addLog(`⚪ 私密提示：你清白但隐藏着秘密。`, 'info');
      }
    }

    // ---------- 初始化 ----------
    function init() {
      renderCharSelection();
      renderKeywords();
      renderTargets();
      renderRelation();
      updatePhaseUI();
      addLog('🌸 欢迎来到《长恨歌·像素蝴蝶》线上连麦版', 'info');
      addLog('🎭 请选择你的角色，其他角色的私密内容对你隐藏', 'info');

      confirmBtn.addEventListener('click', confirmMyRole);
      resetSelBtn.addEventListener('click', function() {
        state.myRoleId = null;
        renderCharSelection();
        confirmBtn.textContent = '✓ 确认我的角色';
      });
      askBtn.addEventListener('click', handleAsk);
      nextSceneBtn.addEventListener('click', nextScene);
      clearLogBtn.addEventListener('click', function() { state.log = []; renderLog(); });
      endingResetBtn.addEventListener('click', function() { chooseEnding('reset'); });
      endingButterflyBtn.addEventListener('click', function() { chooseEnding('butterfly'); });
      modalCloseBtn.addEventListener('click', function() { modalOverlay.classList.add('hidden'); });
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) modalOverlay.classList.add('hidden');
      });
    }

    init();
  })();
</script>
</body>
</html>
